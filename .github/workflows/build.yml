name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 系统依赖（PyQt5 运行库）
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pyqt5 libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python 依赖
        run: |
          pip install pyinstaller evdev pyyaml pyqt5

      - name: 冒烟测试（mock 模式，无需硬件）
        run: |
          QT_QPA_PLATFORM=offscreen python3 smoke_test.py

      - name: PyInstaller 打包
        run: pyinstaller --clean -y tview.spec

      - name: 产物校验
        run: |
          ls -la dist/
          file dist/tview

      - uses: actions/upload-artifact@v4
        with:
          name: tview
          path: dist/tview

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tview
            RELEASE_NOTES.md
            RELEASE_NOTES.en.md
          body_path: RELEASE_NOTES.md
