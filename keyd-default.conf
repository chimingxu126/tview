# ============================================================
# keyd 系统级按键映射（启视·TVIEW 盒子模式标准配置）
# 安装: sudo apt install keyd
# 部署: sudo cp keyd-default.conf /etc/keyd/default.conf && sudo systemctl restart keyd
# 依据: 2026-08-08 真机实测 keycode（USB Composite Device 2.4G 遥控器）
# 说明: keyd 是系统级标准件（GDM/GNOME/tview 全阶段生效），
#       tview 检测到 keyd 后自动走 Qt 事件路径、不再 grab，二者不冲突
# 回退: sudo systemctl stop keyd && sudo rm /etc/keyd/default.conf
# ============================================================
[ids]
*        # 应用到所有键盘类设备（可改为具体设备名过滤）

[main]
# 遥控器返回/主页/菜单（CC 接口 + 键盘接口的非标码）→ 标准化
158 = back          # 返回键 → 标准 Back（安卓 BACK / Qt Key_Back）
172 = home          # 主页键 → 标准 Home（安卓主页）
127 = menu          # 菜单键 → 标准 Menu
14  = backspace     # 设置键 → 退格（tview 解释为打开设置）
111 = delete        # 信号源键 → Delete

# 音量键：标准化成媒体键，系统/安卓原生处理
115 = volumeup
114 = volumedown
113 = mute

# OK / 方向：保持默认（Enter/方向键）
28  = enter
103 = up
108 = down
105 = left
106 = right
